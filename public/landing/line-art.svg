<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none" stroke="#FF6B81" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Mandala, top left -->
  <g transform="translate(170 190)">
    <circle r="110"/>
    <circle r="78"/>
    <circle r="22"/>
    <g id="petal-ring">
      <path d="M0-22 C18-45 18-62 0-78 C-18-62 -18-45 0-22Z"/>
      <path d="M0-78 C26-92 30-104 0-110 C-30-104 -26-92 0-78Z"/>
    </g>
    <use href="#petal-ring" transform="rotate(30)"/>
    <use href="#petal-ring" transform="rotate(60)"/>
    <use href="#petal-ring" transform="rotate(90)"/>
    <use href="#petal-ring" transform="rotate(120)"/>
    <use href="#petal-ring" transform="rotate(150)"/>
    <use href="#petal-ring" transform="rotate(180)"/>
    <use href="#petal-ring" transform="rotate(210)"/>
    <use href="#petal-ring" transform="rotate(240)"/>
    <use href="#petal-ring" transform="rotate(270)"/>
    <use href="#petal-ring" transform="rotate(300)"/>
    <use href="#petal-ring" transform="rotate(330)"/>
  </g>

  <!-- Flower with stem, right -->
  <g transform="translate(1030 300)">
    <g id="flower-petal">
      <path d="M0 0 C30-20 34-62 0-80 C-34-62 -30-20 0 0Z"/>
    </g>
    <use href="#flower-petal" transform="rotate(72)"/>
    <use href="#flower-petal" transform="rotate(144)"/>
    <use href="#flower-petal" transform="rotate(216)"/>
    <use href="#flower-petal" transform="rotate(288)"/>
    <circle r="16"/>
    <path d="M0 80 C-10 200 20 320 -10 470"/>
    <path d="M-4 200 C-60 170 -90 190 -110 230 C-60 240 -30 230 -4 200Z"/>
    <path d="M2 300 C60 270 90 290 110 330 C60 340 30 330 2 300Z"/>
  </g>

  <!-- Small mandala, bottom centre-left -->
  <g transform="translate(420 650)">
    <circle r="60"/>
    <circle r="36"/>
    <g id="small-petal">
      <path d="M0-36 C12-46 12-54 0-60 C-12-54 -12-46 0-36Z"/>
    </g>
    <use href="#small-petal" transform="rotate(45)"/>
    <use href="#small-petal" transform="rotate(90)"/>
    <use href="#small-petal" transform="rotate(135)"/>
    <use href="#small-petal" transform="rotate(180)"/>
    <use href="#small-petal" transform="rotate(225)"/>
    <use href="#small-petal" transform="rotate(270)"/>
    <use href="#small-petal" transform="rotate(315)"/>
    <circle r="8"/>
  </g>

  <!-- Leafy sprig, top centre -->
  <g transform="translate(620 90)">
    <path d="M-120 20 C-40 0 40 0 120 -20"/>
    <path d="M-80 12 C-90 -16 -70 -36 -50 -36 C-50 -10 -64 6 -80 12Z"/>
    <path d="M-30 6 C-20 34 -40 52 -60 50 C-58 26 -46 12 -30 6Z"/>
    <path d="M20 2 C10 -28 30 -46 50 -46 C50 -20 36 -4 20 2Z"/>
    <path d="M70 -8 C82 20 64 40 44 40 C44 16 56 0 70 -8Z"/>
  </g>

  <!-- Small flower, bottom right -->
  <g transform="translate(860 680)">
    <use href="#small-petal"/>
    <use href="#small-petal" transform="rotate(60)"/>
    <use href="#small-petal" transform="rotate(120)"/>
    <use href="#small-petal" transform="rotate(180)"/>
    <use href="#small-petal" transform="rotate(240)"/>
    <use href="#small-petal" transform="rotate(300)"/>
    <circle r="30"/>
  </g>
</svg>
